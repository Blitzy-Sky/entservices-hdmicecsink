# <Inactive Source> from SONY, the playback peer the routing flows switch to and away from.
#
# THE PHYSICAL ADDRESS OPERAND IS 3.0.0.0 AND IT IS NOT FREE TO CHOOSE.
# ../Device_Config_Add_Network.yaml allocates SONY logical address 4 at physical address
# 3.0.0.0 - HDMI input 2 of the sink television - and Process_Active_Source.yaml, the
# document this one reverses, carries the same 3.0.0.0 for the same peer. An earlier
# revision of this file carried 2.0.0.0, which is the AUDIO SYSTEM's address, and the drift
# was not inert: updateActiveSource writes the operand straight into the addressed entry's
# m_physicalAddr, so an <Inactive Source> naming 2.0.0.0 MOVES logical address 4 on top of
# the audio system's port and takes the ARC counterpart's address with it - which makes
# process(InitiateArc)'s deviceList[0x5].m_physicalAddr comparison fail for every ARC
# fixture that runs afterwards.
#
# 0x40  header: initiator 4 (SONY), destination 0 - the sink television. DIRECTED: the CEC
#       specification addresses <Inactive Source> to the television, and the sink's
#       process(InActiveSource) is reached through the directed path.
# 0x9D  opcode <Inactive Source>.
# 0x30, 0x00  physical address 3.0.0.0. Two wire bytes of four nibbles - byte 0 is
#       n0<<4|n1, byte 1 is n2<<4|n3 (Operands.hpp PhysicalAddress).
HdmiCec:
  command: cec_message
  description: Trigger process(InActiveSource) - SONY (LA=4) releases the bus from 3.0.0.0
  message:
    user_defined: true
    payload: ["0x40", "0x9D", "0x30", "0x00"]
