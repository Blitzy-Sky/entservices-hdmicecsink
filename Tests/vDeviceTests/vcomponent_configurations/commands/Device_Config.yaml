# Initial CEC device map posted to the vComponent before a sink test case runs.
#
# The single emulated peer is an AudioSystem, which the vComponent allocates logical address 5
# (its only candidate for that device type). The key-control commands in
# ../../HdmiCECSink_Curl.py address that same logical address, and the directed exchanges in
# ../hdmicec/hdmicec_vcomponent_cec_responses.yaml are answered by this peer. Keep the three in
# step: adding a Playback Device peer here, for example, is what would make address 4 a
# legitimate target.
HdmiCec:
  command: configure
  description: Initialize HDMI CEC device map
  config:
    emulated_device:
      name: "VAUDIO"
      language: "eng"
      cec_version: "1.4"
      device_type: "AudioSystem"
      power_status: "on"
      port_id: 0
      fault: no
      number_of_ports: 4
      active_source: false
    device_map:
      - device:
          name: "VAUDIO"
          language: "eng"
          cec_version: "1.4"
          device_type: "AudioSystem"
          power_status: "on"
          fault: no
          port_id: 0
          number_of_ports: 4
          active_source: false
          children: []
