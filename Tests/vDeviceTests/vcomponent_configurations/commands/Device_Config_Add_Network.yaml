# The full emulated CEC network, and the ports the peers occupy beneath the device under
# test. Init_Devicelist_Populate.py posts this document as its FIRST configuration action
# (NETWORK_CONFIG_YAML), before it enables HDMI-CEC and starts polling getDeviceList, so
# every later fixture in this folder inherits the topology declared here. The filename is
# part of that contract: the module joins this exact name onto utils.HDMICEC_CMD_BASE and
# treats any reply other than HTTP 200 as a rejection, so a renamed document does not fail
# loudly - it leaves the suite with no devices.
#
# EVERY PEER IS SOURCE-ROLE, which is the one structural difference from the source
# plugin's document this file was modelled on. That suite roots its map at an emulated
# television because its device under test is a playback device. Here the device under test
# IS the television: HdmiCecSinkImplementation::allocateLAforTV() claims
# LogicalAddress::TV for the sink itself and holds physical address 0.0.0.0, so an emulated
# peer in that role would collide with it. The device_type values used below are therefore
# limited to AudioSystem, PlaybackDevice, RecordingDevice and Tuner.
#
# The root peer is the audio system declared in config.emulated_device, and its identity is
# load-bearing rather than decorative. The vComponent offers an audio system exactly one
# logical address - LOGICAL_ADDRESS_AUDIOSYSTEM == 5 - and address 5 is the only address for
# which HdmiCecSinkImplementation::addDevice() additionally raises
# ReportAudioDeviceConnectedStatus, which is what makes the System Audio Mode and
# short-audio-descriptor flows observable at all. process(InitiateArc) goes further and
# compares deviceList[0x5].m_physicalAddr against the ARC port's address, so this peer is a
# precondition of every ARC fixture here. Keep the identity in step with
# ../hdmicec/hdmicec_vcomponent_configuration.yaml, whose emulated peer it mirrors.
#
# Two nesting shapes are kept exercisable so the sink's nested-route resolution
# (HdmiPortMap::addChild / getRoute and HdmiCecSinkImplementation::getActiveRoute) can be
# driven end to end rather than only at depth one: an AudioSystem carrying two
# PlaybackDevice children, and a RecordingDevice carrying one. Exactly one device in the
# tree is the active source, as the middleware expects.
#
# The vendor names match the OSD-name payloads Init_Devicelist_Populate.py injects from
# DeviceListConfig/, so a name changed here must be changed there too, or the seeded peer
# will report a name the topology never declared.
HdmiCec:
  command: configure
  description: Initialize HDMI CEC device map
  config:
    emulated_device:
      name: "VAUDIO"
      language: "eng"
      cec_version: "1.4"
      device_type: "AudioSystem"
      power_status: "on"
      port_id: 0
      fault: no
      number_of_ports: 7
      active_source: false
    device_map:
      - device:
          name: "VAUDIO"
          language: "eng"
          cec_version: "1.4"
          device_type: "AudioSystem"
          power_status: "on"
          fault: no
          port_id: 0
          number_of_ports: 7
          active_source: false
          children:
            - device:
                name: "SAMSUNG"
                language: "eng"
                cec_version: "1.4"
                device_type: "Tuner"
                power_status: "on"
                fault: no
                port_id: 1
                number_of_ports: 0
                active_source: false
                children: []
            - device:
                name: "IPSTB"
                language: "eng"
                cec_version: "1.4"
                device_type: "PlaybackDevice"
                power_status: "standby"
                fault: no
                port_id: 2
                number_of_ports: 0
                active_source: false
                children: []
            - device:
                name: "CECAdapter"
                language: "eng"
                cec_version: "1.4"
                device_type: "RecordingDevice"
                power_status: "on"
                fault: no
                port_id: 0
                number_of_ports: 2
                active_source: false
                children:
                  - device:
                      name: "GameConsole"
                      language: "eng"
                      cec_version: "1.4"
                      device_type: "PlaybackDevice"
                      power_status: "on"
                      fault: no
                      port_id: 1
                      number_of_ports: 0
                      active_source: false
                      children: []
            - device:
                name: "SONY"
                language: "eng"
                cec_version: "1.4"
                device_type: "PlaybackDevice"
                power_status: "on"
                fault: no
                port_id: 4
                number_of_ports: 0
                active_source: false
                children: []
            - device:
                name: "LG"
                language: "eng"
                cec_version: "1.4"
                device_type: "AudioSystem"
                power_status: "on"
                fault: no
                port_id: 5
                number_of_ports: 2
                active_source: true
                children:
                  - device:
                      name: "PIONEER"
                      language: "eng"
                      cec_version: "1.4"
                      device_type: "PlaybackDevice"
                      power_status: "on"
                      fault: no
                      port_id: 1
                      number_of_ports: 0
                      active_source: false
                      children: []
                  - device:
                      name: "GOOGLE"
                      language: "eng"
                      cec_version: "1.4"
                      device_type: "PlaybackDevice"
                      power_status: "standby"
                      fault: no
                      port_id: 2
                      number_of_ports: 0
                      active_source: false
                      children: []
            - device:
                name: "PANASONIC"
                language: "eng"
                cec_version: "1.4"
                device_type: "Tuner"
                power_status: "on"
                fault: no
                port_id: 6
                number_of_ports: 0
                active_source: false
                children: []
            - device:
                name: "DENON"
                language: "eng"
                cec_version: "1.4"
                device_type: "RecordingDevice"
                power_status: "on"
                fault: no
                port_id: 7
                number_of_ports: 0
                active_source: false
                children: []
