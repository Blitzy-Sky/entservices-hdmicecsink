HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from LG (LA=10, AudioSystem, sink HDMI port 5)"
  message:
    user_defined: true
    # Header 0xAF: initiator=10 (0xA, LG), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 5.0.0.0 -> 0x50,0x00, device_type AudioSystem=0x05
    payload: ["0xAF", "0x84", "0x50", "0x00", "0x05"]
