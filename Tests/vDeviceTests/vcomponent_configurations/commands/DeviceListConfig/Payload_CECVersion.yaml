HdmiCec:
  command: "cec_message"
  description: "Trigger process(CECVersion) from AudioSystem (LA=5) - CEC 1.4"
  message:
    user_defined: true
    # Header 0x5F: initiator=5 (AudioSystem), destination=0xF (broadcast)
    # Opcode 0x9E: CECVersion
    # 0x05 = CEC 1.4
    payload: ["0x5F", "0x9E", "0x05"]
