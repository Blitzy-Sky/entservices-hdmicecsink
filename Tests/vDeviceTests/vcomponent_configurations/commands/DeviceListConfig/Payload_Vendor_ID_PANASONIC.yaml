HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from PANASONIC (LA=11) - vendor 0x008045"
  message:
    user_defined: true
    # Header 0xBF: initiator=11 (0xB, PANASONIC), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID  Panasonic vendor ID 0x008045
    payload: ["0xBF", "0x87", "0x00", "0x80", "0x45"]
