HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from DENON (LA=2) - vendor 0x0009B0"
  message:
    user_defined: true
    # Header 0x2F: initiator=2 (DENON, Recording Device 2), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID  Denon vendor ID 0x0009B0
    payload: ["0x2F", "0x87", "0x00", "0x09", "0xB0"]
