HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from LG (LA=2) - vendor 0x00E091"
  message:
    user_defined: true
    # 0x2F  header: initiator 2 (LG), destination 0xF (broadcast).
    #        process(DeviceVendorID) returns early for anything that is not a broadcast
    #        (HdmiCecSinkImplementation.cpp:380-383).
    # 0x87  opcode <Device Vendor ID>.
    # 0x00, 0xE0, 0x91  LG's 24-bit IEEE registration identifier 0x00E091.
    payload: ["0x2F", "0x87", "0x00", "0xE0", "0x91"]
