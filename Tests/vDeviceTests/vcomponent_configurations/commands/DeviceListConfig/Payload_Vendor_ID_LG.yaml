HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from LG (LA=10) - vendor 0x00E091"
  message:
    user_defined: true
    # Header 0xAF: initiator=10 (0xA, LG), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID  LG vendor ID 0x00E091
    payload: ["0xAF", "0x87", "0x00", "0xE0", "0x91"]
