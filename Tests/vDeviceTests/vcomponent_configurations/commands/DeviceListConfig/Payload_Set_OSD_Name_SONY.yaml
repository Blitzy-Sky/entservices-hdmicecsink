HdmiCec:
  command: "cec_message"
  description: "Trigger process(SetOSDName) from SONY (LA=9) - OSD name 'SONY'"
  message:
    user_defined: true
    # Header 0x90: initiator=9 (SONY), destination=0 (sink DUT, directed)
    # Opcode 0x47: SetOSDName  "SONY" = 0x53 0x4F 0x4E 0x59
    payload: ["0x90", "0x47", "0x53", "0x4F", "0x4E", "0x59"]
