HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from SAMSUNG (LA=3) - vendor 0x0000F0"
  message:
    user_defined: true
    # Header 0x3F: initiator=3 (SAMSUNG), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID  Samsung vendor ID 0x0000F0
    payload: ["0x3F", "0x87", "0x00", "0x00", "0xF0"]
