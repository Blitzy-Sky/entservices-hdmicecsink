HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from SONY (LA=4, PlaybackDevice, sink HDMI port 4)"
  message:
    user_defined: true
    # Header 0x4F: initiator=4 (SONY), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 4.0.0.0 -> 0x40,0x00, device_type PlaybackDevice=0x04
    payload: ["0x4F", "0x84", "0x40", "0x00", "0x04"]
