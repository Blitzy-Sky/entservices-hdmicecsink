HdmiCec:
  command: "cec_message"
  description: "Trigger process(DeviceVendorID) from AudioSystem (LA=5) - Yamaha vendor 0x00A0AF"
  message:
    user_defined: true
    # Header 0x5F: initiator=5 (AudioSystem), destination=0xF (broadcast)
    # Opcode 0x87: DeviceVendorID
    # Yamaha vendor ID 0x00A0AF
    payload: ["0x5F", "0x87", "0x00", "0xA0", "0xAF"]
