HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from DENON (LA=2, RecordingDevice, sink HDMI port 7)"
  message:
    user_defined: true
    # Header 0x2F: initiator=2 (DENON, Recording Device 2), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 7.0.0.0 -> 0x70,0x00, device_type RecordingDevice=0x01
    payload: ["0x2F", "0x84", "0x70", "0x00", "0x01"]
