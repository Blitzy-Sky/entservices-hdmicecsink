HdmiCec:
  command: "cec_message"
  description: "Trigger process(SetOSDName) from LG (LA=10) - OSD name 'LG'"
  message:
    user_defined: true
    # Header 0xA0: initiator=10 (0xA, LG), destination=0 (sink DUT, directed)
    # Opcode 0x47: SetOSDName  "LG" = 0x4C 0x47
    payload: ["0xA0", "0x47", "0x4C", "0x47"]
