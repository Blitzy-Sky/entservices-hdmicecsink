HdmiCec:
  command: "cec_message"
  description: "Trigger process(SetOSDName) from LG (LA=2) - OSD name 'LG'"
  message:
    user_defined: true
    # 0x20  header: initiator 2 (LG), destination 0 - the sink television. This one is
    #        DIRECTED: process(SetOSDName) discards broadcasts (HdmiCecSinkImplementation.cpp:307)
    #        exactly where process(ReportPhysicalAddress) and process(DeviceVendorID) discard
    #        directed frames, so the three payloads for one peer are not addressed alike.
    # 0x47  opcode <Set OSD Name>.
    # 0x4C, 0x47  "LG" in ASCII.
    payload: ["0x20", "0x47", "0x4C", "0x47"]
