HdmiCec:
  command: "cec_message"
  description: "Trigger process(ReportPhysicalAddress) from PANASONIC (LA=11, Tuner, sink HDMI port 6)"
  message:
    user_defined: true
    # Header 0xBF: initiator=11 (0xB, PANASONIC), destination=0xF (broadcast)
    # Opcode 0x84: ReportPhysicalAddress
    # Physical 6.0.0.0 -> 0x60,0x00, device_type Tuner=0x03
    payload: ["0xBF", "0x84", "0x60", "0x00", "0x03"]
