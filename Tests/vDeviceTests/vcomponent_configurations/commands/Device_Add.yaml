# Adds one HDMI-CEC peer to the vComponent's device map at run time, after the map has
# already been configured. This document and Device_Remove.yaml are a matched pair, and
# Device_Status.yaml updates the same peer, so all three name "GameConsole" - which is
# also the PlaybackDevice declared beneath CECAdapter in Device_Config_Add_Network.yaml.
# That name has to change in all four places at once, or the add, the status update and
# the remove will address a device the topology never declared.
#
# The filename is part of the contract rather than a label: utils.HDMICEC_CMD_BASE
# resolves to this directory and a consumer posts the literal "Device_Add.yaml" joined
# onto it. A renamed document does not fail loudly - the post comes back not-found and
# the step is silently skipped, costing coverage with nothing to show for it.
#
# parent: is the one value below that differs from the source plugin's document this file
# was modelled on, and it is load-bearing. It names the root of the device map the new
# peer is attached beneath, so it has to name the root that actually exists here: the
# audio system that Device_Config.yaml, Device_Config_Add_Network.yaml and
# ../hdmicec/hdmicec_vcomponent_configuration.yaml all declare identically as that root.
# The source plugin's suite roots its map at an emulated television because its device
# under test is a playback device; here the device under test IS the television -
# HdmiCecSinkImplementation::allocateLAforTV() claims LogicalAddress::TV for the sink
# itself and holds physical address 0.0.0.0 - so no emulated peer may take that role. A
# parent naming a root that does not exist is not rejected either; the peer just attaches
# to nothing. device_type is correspondingly one of the four source-role types this tree
# admits - AudioSystem, PlaybackDevice, RecordingDevice or Tuner.
#
# One precondition is deliberately NOT encoded here. addDevice() returns early while
# m_logicalAddressAllocated == LogicalAddress::UNREGISTERED, so the plugin must already
# have been enabled and have claimed its logical address before this document is posted,
# or the OnDeviceAdded notification never fires. Init_Devicelist_Populate.py owns that
# sequencing; a static fixture cannot express it.
HdmiCec:
  command: add_device
  description: Add a new HDMI CEC device to the device map
  device:
    name: "GameConsole"
    parent: "VAUDIO"
    language: "eng"
    cec_version: "1.4"
    device_type: "PlaybackDevice"
    power_status: "on"
    fault: no
    port_id: 1
    number_of_ports: 0
    active_source: false
