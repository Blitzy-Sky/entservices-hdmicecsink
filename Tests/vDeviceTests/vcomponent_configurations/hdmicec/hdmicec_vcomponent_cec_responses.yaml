HdmiCec:
  cec_messages:
    # Role-independent exchanges carried over from the HdmiCecSource template.
    - request: { opcode: "ImageViewOn", type: "Direct", payload: null}
      response: null
    - request: { opcode: "TextViewOn", type: "Direct", payload: null}
      response: null
    - request: { opcode: "SetMenuLanguage", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "Standby", type: "Direct", payload: null}
      response: null
    - request: { opcode: "SetOsdName", type: "Direct", payload: null}
      response: null
    - request: { opcode: "SetOsdString", type: "Direct", payload: null}
      response: null
    - request: { opcode: "ActiveSource", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "ReportPhysicalAddress", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "DeviceVendorId", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "ReportPowerStatus", type: "Direct", payload: null}
      response: null
    - request: { opcode: "CecVersion", type: "Direct", payload: null}
      response: null
    - request: { opcode: "GiveLatency", type: "Direct", payload: null}
      response: null
    - request: { opcode: "GiveOsdName", type: "Direct", payload: null}
      response: { opcode: "SetOsdName", type: "Direct", payload: ["osd_name"]}
    - request: { opcode: "GivePhysicalAddress", type: "Direct", payload: null}
      response: { opcode: "ReportPhysicalAddress", type: "Broadcast", payload: ["physical_address", "device_type"]}
    - request: { opcode: "RequestActiveSource", type: "Broadcast", payload: null}
      response: { opcode: "ActiveSource", type: "Broadcast", payload: ["physical_address"]}
    # The REQUEST is directed - the sink asks one peer - but the REPLY MUST BE BROADCAST, and
    # that asymmetry is imposed by the device under test rather than chosen here.
    # HdmiCecSinkProcessor::process(DeviceVendorID) opens on
    #     if(!(header.to == LogicalAddress(LogicalAddress::BROADCAST))) { return; }
    # (HdmiCecSinkImplementation.cpp:380-383), so a directed <Device Vendor ID> is discarded
    # before addDevice() or the vendorID update is reached: the peer would answer, the exchange
    # would look correct, and the sink would learn nothing. The reply is broadcast in HDMI-CEC
    # 1.4b too - <Device Vendor ID> is defined as a broadcast message - so the wire protocol and
    # the sink's guard agree. Compare the GiveOsdName row above, where the polarity is the
    # opposite: process(SetOSDName) discards BROADCAST and accepts only a directed reply.
    - request: { opcode: "GiveDeviceVendorId", type: "Direct", payload: null}
      response: { opcode: "DeviceVendorId", type: "Broadcast", payload: ["vendor_id"]}
    - request: { opcode: "GiveDevicePowerStatus", type: "Direct", payload: null}
      response: { opcode: "ReportPowerStatus", type: "Direct", payload: ["power_status"]}
    - request: { opcode: "GetMenuLanguage", type: "Direct", payload: null}
      response: { opcode: "SetMenuLanguage", type: "Broadcast", payload: ["language"]}
    - request: { opcode: "GiveCecVersion", type: "Direct", payload: null}
      response: { opcode: "CecVersion", type: "Direct", payload: ["cec_version"]}
    - request: { opcode: "ReportLatency", type: "Broadcast", payload: null}
      response: { opcode: "GiveLatency", type: "Broadcast", payload: ["latency"]}
    # Sink-only ARC, audio and version exchanges; replies are Direct because the sink discards broadcast ones.
    - request: { opcode: "RequestArcInitiation", type: "Direct", payload: null}
      response: { opcode: "InitiateArc", type: "Direct", payload: null}
    - request: { opcode: "RequestArcTermination", type: "Direct", payload: null}
      response: { opcode: "TerminateArc", type: "Direct", payload: null}
    - request: { opcode: "GiveAudioStatus", type: "Direct", payload: null}
      response: { opcode: "ReportAudioStatus", type: "Direct", payload: null}
    - request: { opcode: "RequestShortAudioDescriptor", type: "Direct", payload: null}
      response: { opcode: "ReportShortAudioDescriptor", type: "Direct", payload: null}
    - request: { opcode: "SystemAudioModeRequest", type: "Direct", payload: null}
      response: { opcode: "SetSystemAudioMode", type: "Direct", payload: null}
    - request: { opcode: "GiveSystemAudioModeStatus", type: "Direct", payload: null}
      response: { opcode: "SystemAudioModeStatus", type: "Direct", payload: null}
    - request: { opcode: "GetCecVersion", type: "Direct", payload: null}
      response: { opcode: "CecVersion", type: "Direct", payload: ["cec_version"]}
    # Sink-only opcodes the peer absorbs without replying, including the sink's own ARC reports.
    - request: { opcode: "ReportArcInitiated", type: "Direct", payload: null}
      response: null
    - request: { opcode: "ReportArcTerminated", type: "Direct", payload: null}
      response: null
    - request: { opcode: "ReportFeatures", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "ReportCurrentLatency", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "RequestCurrentLatency", type: "Direct", payload: null}
      response: null
    - request: { opcode: "GiveFeatures", type: "Direct", payload: null}
      response: null
    - request: { opcode: "InactiveSource", type: "Direct", payload: null}
      response: null
    - request: { opcode: "UserControlPressed", type: "Direct", payload: null}
      response: null
    - request: { opcode: "UserControlReleased", type: "Direct", payload: null}
      response: null
    - request: { opcode: "RoutingChange", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "RoutingInformation", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "SetStreamPath", type: "Broadcast", payload: null}
      response: null
    - request: { opcode: "FeatureAbort", type: "Direct", payload: null}
      response: null
